[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-file-agent"
version = "0.2.0"
description = "Voice-driven agentic file finder/opener for macOS — Claude Agent SDK brain, Spotlight hands, local Whisper ears, say TTS mouth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajesh Tippana", email = "rajeshraja23ss@gmail.com" }]
dependencies = [
    "claude-agent-sdk>=0.2",
    "faster-whisper>=1.2",
    "sounddevice>=0.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
voice-file-agent = "voice_file_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_file_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long tool descriptions/prompts are fine

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: needs macOS audio stack and the Whisper model (run locally: pytest -m integration)",
]
testpaths = ["tests"]
